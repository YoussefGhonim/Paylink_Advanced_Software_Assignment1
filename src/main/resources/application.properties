spring.application.name=PayLink

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paylink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:paylink}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:paylink123}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
